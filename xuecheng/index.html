<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00b578" />
  <title>学程</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <h1 class="app-title">学程</h1>
      <p class="app-subtitle">今天也要劳逸结合</p>
    </div>
  </header>

  <main class="app-main">
    <section class="card" aria-labelledby="todo-title">
      <div class="card__head">
        <h2 id="todo-title" class="card__title">待办清单</h2>
        <span class="card__hint">0 项</span>
      </div>
      <div class="empty" data-view="todo-empty">
        <p class="empty__icon">🗒️</p>
        <p class="empty__text">还没有任务，点右下角 ＋ 新建一个吧</p>
      </div>
      <ul class="todo-list" data-view="todo-list" hidden></ul>
    </section>

    <section class="card" aria-labelledby="timeline-title">
      <div class="card__head">
        <h2 id="timeline-title" class="card__title">今日时间轴</h2>
      </div>
      <div class="empty" data-view="timeline-empty">
        <p class="empty__icon">⏱️</p>
        <p class="empty__text">排好的学习与休息会显示在这里</p>
      </div>
      <ol class="timeline" data-view="timeline" hidden></ol>
    </section>
  </main>

  <button class="fab" type="button" aria-label="新建任务" title="新建任务">＋</button>

  <div class="modal" data-view="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__panel">
      <div class="modal__head">
        <h2 class="modal__title">新建任务</h2>
        <button class="modal__close" type="button" aria-label="关闭">×</button>
      </div>
      <form id="task-form" class="task-form" novalidate>
        <div class="field">
          <label for="f-subject">科目 <span class="req">*</span></label>
          <input id="f-subject" name="subject" type="text" placeholder="如：数学" />
        </div>
        <div class="field">
          <label for="f-duration">预计时长（分钟）<span class="req">*</span></label>
          <input id="f-duration" name="durationMin" type="number" min="1" step="1" placeholder="如：60" />
        </div>
        <div class="field">
          <label for="f-deadline">截止日期</label>
          <input id="f-deadline" name="deadline" type="date" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-priority">优先级</label>
            <select id="f-priority" name="priority">
              <option value="high">高</option>
              <option value="medium" selected>中</option>
              <option value="low">低</option>
            </select>
          </div>
          <div class="field">
            <label for="f-difficulty">难度</label>
            <select id="f-difficulty" name="difficulty">
              <option value="easy">简单</option>
              <option value="medium" selected>中等</option>
              <option value="hard">困难</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="f-rest">完成后休息时长（分钟）</label>
          <input id="f-rest" name="restAfterMin" type="number" min="0" step="1" value="0" />
        </div>
        <p class="form-errors" data-view="form-errors" hidden></p>
        <div class="form-actions">
          <button type="button" class="btn btn--ghost" data-action="cancel">取消</button>
          <button type="submit" class="btn btn--primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/task.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
